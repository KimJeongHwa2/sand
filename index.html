<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 우리반 AI 릴스·쇼츠 스튜디오</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff6b6b;
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 50%, #fef3c7 100%);
      --card: #ffffff;
      --text: #334155;
    }
    * {
      box-sizing: border-box;
      font-family: 'Noto Sans KR', '맑은 고딕', sans-serif;
    }
    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border-radius: 30px;
      padding: 32px 28px;
      box-shadow: 0 15px 35px rgba(148, 163, 184, 0.25);
      border: 4px solid #ffffff;
    }
    .header-badge {
      display: inline-block;
      background: #fff3bf;
      color: #d9480f;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .title-area {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 30px;
      margin: 0 0 8px 0;
      color: #1e293b;
    }
    p.subtitle {
      color: #64748b;
      font-size: 15px;
      margin: 0;
    }
    .counter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 10px 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    .counter-pill {
      background: #4dabf7;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 15px;
      color: #1e293b;
    }
    .step-num {
      background: #ff6b6b;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
    }
    input, select, textarea {
      width: 100%;
      padding: 13px 16px;
      background: #f8fafc;
      color: #1e293b;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 15px;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      background: #ffffff;
      border-color: #4dabf7;
      box-shadow: 0 0 0 4px rgba(77, 171, 247, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 95px;
      line-height: 1.5;
    }
    .row {
      display: flex;
      gap: 12px;
    }
    .row > div {
      flex: 1;
    }
    .preset-area {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .preset-btn {
      background: #eef2ff;
      color: #4f46e5;
      border: 1.5px solid #c7d2fe;
      border-radius: 12px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .preset-btn:hover {
      background: #4f46e5;
      color: white;
    }
    .btn {
      width: 100%;
      padding: 17px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8787 100%);
      color: white;
      border: none;
      border-radius: 18px;
      font-family: 'Jua', sans-serif;
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 6px 0 #e03131;
      margin-top: 8px;
    }
    .btn:disabled {
      background: #cbd5e1;
      box-shadow: 0 6px 0 #94a3b8;
      cursor: not-allowed;
    }
    .status-box {
      display: none;
      margin-top: 22px;
      padding: 20px;
      background: #f0f9ff;
      border: 2px dashed #7dd3fc;
      border-radius: 20px;
      text-align: center;
      font-size: 15px;
      line-height: 1.6;
    }
    .magic-icon {
      font-size: 32px;
      display: inline-block;
      animation: bounce 1s infinite alternate;
      margin-bottom: 6px;
    }
    @keyframes bounce {
      from { transform: translateY(0px) rotate(-10deg); }
      to { transform: translateY(-8px) rotate(10deg); }
    }
    .error-text { color: #e03131; font-weight: 700; word-break: keep-all; }
    .info-text { color: #0284c7; font-weight: 700; }
    .result-box {
      display: none;
      margin-top: 26px;
      text-align: center;
      padding: 22px;
      background: #f0fdf4;
      border: 2px solid #86efac;
      border-radius: 22px;
    }
    .result-box h3 {
      font-family: 'Jua', sans-serif;
      font-size: 22px;
      color: #15803d;
      margin: 0 0 14px 0;
    }
    video {
      width: 100%;
      max-height: 440px;
      border-radius: 16px;
      background: #000;
      margin-bottom: 16px;
    }
    .download-btn {
      display: inline-block;
      padding: 14px 28px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 0 #059669;
    }
    .download-btn:hover {
      background: #059669;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="title-area">
    <span class="header-badge">🎬 초등 릴스·쇼츠 크리에이터 수업</span>
    <h1>✨ AI 8초 마법 영상 스튜디오</h1>
    <p class="subtitle">내가 상상한 장면을 영어로 적으면 AI 감독님이 영상으로 만들어 줘요!</p>
  </div>

  <div class="counter-bar">
    <span>🎟️ 오늘 내가 만든 영상 개수</span>
    <span class="counter-pill"><span id="videoCount">0</span> / 8개 완료</span>
  </div>

  <div class="form-group">
    <label for="apiKey"><span class="step-num">1</span> 선생님께 받은 비밀 열쇠 (API Key)</label>
    <input type="password" id="apiKey" placeholder="sk-or-v1- 로 시작하는 열쇠를 붙여넣으세요">
  </div>

  <div class="row">
    <div class="form-group">
      <label for="modelSelect"><span class="step-num">2</span> AI 감독님 선택</label>
      <select id="modelSelect">
        <option value="heygen/heygen-video-1" selected>🎵 HeyGen 감독 (추천·소리포함)</option>
        <option value="x-ai/grok-imagine-video:free">🆓 Grok 감독 (무료 연습용)</option>
        <option value="bytedance/seedance-1-5-pro">🔇 Seedance 감독 (무음·선명)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="aspectRatio"><span class="step-num">3</span> 화면 모양</label>
      <select id="aspectRatio">
        <option value="9:16" selected>📱 세로 화면 (릴스·쇼츠용)</option>
        <option value="16:9">🖥️ 가로 화면 (유튜브용)</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label for="prompt"><span class="step-num">4</span> 만들고 싶은 장면 설명 (영어)</label>
    <textarea id="prompt" placeholder="제미나이에서 만든 영어 문장을 여기에 붙여넣거나, 아래 추천 버튼을 눌러보세요!"></textarea>
    <div class="preset-area">
      <button type="button" class="preset-btn" onclick="setPreset('A cute white Maltese puppy wearing a tiny superhero cape, flying happily over a colorful rainbow city, Pixar 3D animation style')">🐶 우주 강아지</button>
      <button type="button" class="preset-btn" onclick="setPreset('A fluffy orange cat wearing a chef hat, flipping pancakes in a cozy kitchen, cute cartoon style, bright lighting')">🐱 셰프 고양이</button>
      <button type="button" class="preset-btn" onclick="setPreset('A magical floating castle made of candy and clouds in a sparkling sunset sky, dreamy fantasy animation')">🏰 캔디 구름 성</button>
      <button type="button" class="preset-btn" onclick="setPreset('A friendly little round robot dancing happily in a school classroom with colorful confetti, 3D animation')">🤖 댄스 로봇</button>
    </div>
  </div>

  <button class="btn" id="generateBtn" onclick="generateVideo()">🪄 8초 마법 영상 만들기!</button>

  <div class="status-box" id="statusBox">
    <div class="magic-icon" id="magicIcon">🪄</div>
    <div id="statusText" class="info-text">AI 감독님에게 대본을 전달하고 있어요...</div>
  </div>

  <div class="result-box" id="resultBox">
    <h3>🎉 와! 멋진 8초 영상이 완성되었어요!</h3>
    <video id="videoPlayer" controls playsinline></video>
    <br>
    <button type="button" id="downloadBtn" class="download-btn" onclick="downloadCurrentVideo()">💾 내 컴퓨터에 영상 저장하기 (.mp4)</button>
  </div>
</div>

<script>
  let currentBlobUrl = '';
  let currentFileName = 'my_ai_reels.mp4';
  let activeTimer = null;

  window.onload = () => {
    const savedKey = localStorage.getItem('openrouter_student_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
    
    const savedCount = localStorage.getItem('openrouter_video_count') || '0';
    document.getElementById('videoCount').innerText = savedCount;
  };

  function setPreset(text) {
    document.getElementById('prompt').value = text;
  }

  function showError(msg) {
    if (activeTimer) clearInterval(activeTimer);
    document.getElementById('magicIcon').style.display = 'none';
    const statusText = document.getElementById('statusText');
    statusText.className = 'error-text';
    statusText.innerText = '😢 ' + msg;
    document.getElementById('generateBtn').disabled = false;
  }

  async function fetchVideoAsBlob(jobId, apiKey, unsignedUrls) {
    const contentUrl = `https://openrouter.ai/api/v1/videos/${jobId}/content?index=0`;
    const authRes = await fetch(contentUrl, {
      method: 'GET',
      headers: {
        'Authorization': `Bearer ${apiKey}`
      }
    });

    if (authRes.ok) {
      const blob = await authRes.blob();
      if (blob.size > 1000 && !blob.type.includes('json')) {
        return blob;
      }
    }

    if (unsignedUrls && unsignedUrls.length > 0 && !unsignedUrls[0].includes('openrouter.ai/api/')) {
      const publicRes = await fetch(unsignedUrls[0]);
      if (publicRes.ok) {
        return await publicRes.blob();
      }
    }

    throw new Error(`영상 파일을 내려받지 못했습니다 (코드 ${authRes.status}).`);
  }

  async function generateVideo() {
    const apiKey = document.getElementById('apiKey').value.trim().replace(/\s+/g, '');
    const model = document.getElementById('modelSelect').value;
    const aspectRatio = document.getElementById('aspectRatio').value;
    const prompt = document.getElementById('prompt').value.trim();

    if (!apiKey || !apiKey.startsWith('sk-or-')) {
      alert('1번 칸에 선생님께 받은 비밀 열쇠(sk-or-v1-...)를 먼저 넣어주세요!');
      return;
    }
    if (!prompt) {
      alert('4번 칸에 만들고 싶은 영상 장면을 영어로 적어주세요!');
      return;
    }

    localStorage.setItem('openrouter_student_key', apiKey);
    const btn = document.getElementById('generateBtn');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const magicIcon = document.getElementById('magicIcon');
    const resultBox = document.getElementById('resultBox');

    if (activeTimer) clearInterval(activeTimer);
    btn.disabled = true;
    resultBox.style.display = 'none';
    statusBox.style.display = 'block';
    magicIcon.style.display = 'inline-block';
    statusText.className = 'info-text';
    statusText.innerText = '1단계: AI 감독님에게 대본을 전달하고 있어요...';

    try {
      const createRes = await fetch('https://openrouter.ai/api/v1/videos', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json',
          'X-Title': 'Elementary Reels Studio'
        },
        body: JSON.stringify({
          model: model,
          prompt: prompt,
          duration: 8,
          resolution: "480p",
          aspect_ratio: aspectRatio
        })
      });

      const rawText = await createRes.text();
      let createData;
      try {
        createData = JSON.parse(rawText);
      } catch (e) {
        throw new Error(`서버 연결 오류 (코드 ${createRes.status}).`);
      }

      if (!createRes.ok) {
        throw new Error(createData.error?.message || `요청 거절 (${createRes.status}) - 열쇠 한도나 잔액을 확인해 주세요.`);
      }

      const jobId = createData.id;
      if (!jobId) {
        throw new Error('작업 번호(ID)를 받지 못했습니다. 다시 시도해 주세요.');
      }

      const statusEndpoint = `https://openrouter.ai/api/v1/videos/${jobId}`;

      let seconds = 0;
      activeTimer = setInterval(async () => {
        seconds += 8;
        if (seconds > 180) {
          showError('시간이 너무 오래 걸려 중단되었어요(3분 초과). 다시 한 번 눌러주세요.');
          return;
        }

        statusText.innerText = `2단계: AI 감독님이 영상을 그리고 있어요! (${seconds}초 지남 / 약 30초~1분 소요)`;

        try {
          const statusRes = await fetch(statusEndpoint, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${apiKey}`
            }
          });

          const statusRaw = await statusRes.text();
          let statusData;
          try {
            statusData = JSON.parse(statusRaw);
          } catch (e) {
            return;
          }

          if (statusData.status === 'completed') {
            clearInterval(activeTimer);
            statusText.innerText = '3단계: 완성된 영상 파일을 안전하게 가져오는 중이에요...';

            const videoBlob = await fetchVideoAsBlob(jobId, apiKey, statusData.unsigned_urls);

            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            currentBlobUrl = URL.createObjectURL(videoBlob);

            let currentCount = parseInt(localStorage.getItem('openrouter_video_count') || '0', 10) + 1;
            localStorage.setItem('openrouter_video_count', currentCount.toString());
            document.getElementById('videoCount').innerText = currentCount;

            currentFileName = `AI_릴스_${currentCount}번.mp4`;
            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.src = currentBlobUrl;
            videoPlayer.load();

            statusBox.style.display = 'none';
            resultBox.style.display = 'block';
            btn.disabled = false;

          } else if (statusData.status === 'failed' || statusData.error) {
            showError(statusData.error?.message || '영상 생성에 실패했어요. 문장을 조금 바꿔서 다시 해볼까요?');
          }
        } catch (pollErr) {
          showError(pollErr.message);
        }
      }, 8000);

    } catch (err) {
      if (err.message.includes('Failed to fetch')) {
        showError('인터넷 연결에 실패했어요! 와이파이나 방화벽 상태를 확인해 주세요.');
      } else {
        showError(err.message);
      }
    }
  }

  function downloadCurrentVideo() {
    if (!currentBlobUrl) return;
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = currentBlobUrl;
    a.download = currentFileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>

</body>
</html>
